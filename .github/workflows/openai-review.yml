name: PR Review with OpenAI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Fetch the pull request ref and 2.x branch
      run: |
        git fetch origin +refs/pull/${{ github.event.pull_request.number }}/merge:pr-merge
        git fetch origin 2.x:2.x

    - name: Ensure we're on the PR merge commit
      run: git checkout pr-merge

    - name: Get PR Diff
      run: git diff 2.x pr-merge > diff.txt

    - name: Print Diff for Debugging
      run: |
        echo "Content of diff.txt:"
        cat diff.txt

    - name: Send Diff to OpenAI
      id: openai_review
      run: |
        DIFF_CONTENT=$(cat diff.txt)
        PROMPT="You are a senior developer reviewing a pull request. Here is the diff:\n\n$DIFF_CONTENT\n\nPlease review the code and provide feedback. If it is acceptable, respond with \"APPROVE\". If there are issues, respond with \"FAIL\" followed by your feedback."

        # Print the prompt to the console
        echo "Prompt sent to OpenAI:"
        printf "%s\n" "$PROMPT"
        RESPONSE=$(curl https://api.openai.com/v1/chat/completions \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
          -d '{
            "model": "gpt-4o-mini",
            "messages": [{
              "role": "user",
              "content": "'"$PROMPT"'"
            }],
            "max_tokens": 500
          }')
        echo "$RESPONSE" > response.txt

    - name: Parse OpenAI Response
      id: parse_response
      run: |
        REVIEW=$(cat response.txt)
        echo "$REVIEW"
        if echo "$REVIEW" | grep -q "APPROVE"; then
          echo "PR approved by OpenAI."
        else
          echo "$REVIEW" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
