name: PR Review with OpenAI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Fetch the pull request ref and 2.x branch
      run: |
        git fetch origin +refs/pull/${{ github.event.pull_request.number }}/merge:pr-merge
        git fetch origin 2.x:2.x

    - name: Ensure we're on the PR merge commit
      run: git checkout pr-merge

    - name: Get PR Diff
      run: git diff 2.x pr-merge > diff.txt

    - name: Print Diff for Debugging
      run: |
        echo "Content of diff.txt:"
        cat diff.txt

    - name: Send Diff to OpenAI
      id: openai_review
      run: |
        DIFF_CONTENT=$(cat diff.txt)
        PROMPT="You are a senior developer reviewing a pull request. Here is the diff:\n\n${DIFF_CONTENT}\n\nPlease review the code and provide feedback. If it is acceptable, respond with \"APPROVE\". If there are issues, respond with \"FAIL\" followed by your feedback."

        # Escape the prompt for JSON
        ESCAPED_PROMPT=$(echo "$PROMPT" | jq -Rs .)

        # Print the prompt to the console
        echo "Prompt sent to OpenAI:"
        echo "$PROMPT"

        RESPONSE=$(curl https://api.openai.com/v1/chat/completions \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
          -d "{
            \"model\": \"gpt-4-turbo-preview\",
            \"messages\": [{
              \"role\": \"user\",
              \"content\": $ESCAPED_PROMPT
            }],
            \"max_tokens\": 500
          }")
        echo "$RESPONSE" > response.txt

    - name: Parse OpenAI Response
      id: parse_response
      run: |
        REVIEW=$(cat response.txt | jq -r '.choices[0].message.content')
        echo "review<<EOF" >> $GITHUB_OUTPUT
        echo "$REVIEW" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        if echo "$REVIEW" | grep -q "APPROVE"; then
          echo "status=approved" >> $GITHUB_OUTPUT
        else
          echo "status=failed" >> $GITHUB_OUTPUT
        fi

    - name: Comment on PR
      uses: actions/github-script@v6
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          const fs = require('fs');

          // Read the review from the file
          const reviewContent = fs.readFileSync('response.txt', 'utf8');

          // Parse the JSON response
          const reviewData = JSON.parse(reviewContent);

          // Extract the review text
          const review = reviewData.choices[0].message.content;

          // Determine the status
          const status = review.includes('APPROVE') ? 'APPROVED' : 'FAILED';

          // Construct the comment
          const comment = `OpenAI Review Result: ${status}\n\n${review}`;

          // Post the comment
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

          // Set the action status
          if (status === 'FAILED') {
            core.setFailed('OpenAI review failed. See comment for details.');
          }
